<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Qualis — GenLayer Evaluation Protocol</title>
    <meta
      name="description"
      content="Qualis is a GenLayer-native evaluation protocol demonstrating non-deterministic execution and validator consensus."
    />    <script>
      (function() {
        try {
          var saved = localStorage.getItem('qualis-theme');
          var dark = saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
